<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
        {{ form.name }}
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Brand</label>
        {{ form.brand }}
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">SKU</label>
        {{ form.sku }}
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Dosage Form</label>
        {{ form.dosage_form }}
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Strength</label>
        {{ form.strength }}
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Price</label>
        {{ form.price }}
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Stock Quantity</label>
        {{ form.stock_quantity }}
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Low Stock Threshold</label>
        {{ form.low_stock_threshold }}
    </div>
</div>

<div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
    {{ form.description }}
</div>

<!-- Image Upload -->
<div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Medicine Image</label>
    <input type="file" name="file" id="modalImageInput" />
    <input type="hidden" name="uploaded_file" id="modalUploadedFile" value="{{ existing_image_name|default:'' }}">
    <input type="hidden" id="existingImageUrl" value="{{ existing_image_url|default:'' }}">
</div>

<div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-200">
    <button type="button" onclick="closeMedicineModal()" class="px-4 py-2 text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">Cancel</button>
    <button type="submit" id="saveMedicineBtn" class="px-4 py-2 bg-primary-500 text-white rounded-lg hover:bg-primary-600 transition-colors">Save Medicine</button>
</div>
